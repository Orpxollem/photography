name: Keep Site Active

on:
  schedule:
    # Every 5 minutes — gives enough margin for Render's 15-min spin-down
    # Note: GitHub Actions cron can lag by a few minutes, so 5-min interval
    # is safer than 10-min for a 15-min inactivity timeout.
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Render site
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Services
        run: |
          # 1. Ping Render Frontend (Primary)
          RENDER_URL="${{ secrets.RENDER_SITE_URL }}"
          if [ ! -z "$RENDER_URL" ]; then
            echo "Pinging Primary Render: $RENDER_URL ..."
            curl -L -s -o /dev/null -w "Status: %{http_code}\n" --max-time 30 "$RENDER_URL"
          fi

          # 2. Ping Render Frontend (Secondary/Other)
          RENDER_URL_2="${{ secrets.RENDER_SITE_URL_2 }}"
          if [ ! -z "$RENDER_URL_2" ]; then
            echo "Pinging Secondary Render: $RENDER_URL_2 ..."
            curl -L -s -o /dev/null -w "Status: %{http_code}\n" --max-time 30 "$RENDER_URL_2"
          fi

          # 3. Ping Supabase Project (Primary)
          SUPA_URL="${{ secrets.SUPABASE_URL }}"
          if [ ! -z "$SUPA_URL" ]; then
            echo "Pinging Primary Supabase: $SUPA_URL ..."
            curl -L -s -o /dev/null -w "Status: %{http_code}\n" --max-time 30 "$SUPA_URL"
          fi

          # 4. Ping Supabase Project (Secondary)
          SUPA_URL_2="${{ secrets.SUPABASE_URL_2 }}"
          if [ ! -z "$SUPA_URL_2" ]; then
            echo "Pinging Secondary Supabase: $SUPA_URL_2 ..."
            curl -L -s -o /dev/null -w "Status: %{http_code}\n" --max-time 30 "$SUPA_URL_2"
          fi
